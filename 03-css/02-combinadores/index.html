<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Combinadores</title><style>
/* Descendant Selector */
div p { background-color:yellow; }
/* Child Selector */
/* div > p { background-color:red; } */
/* Adjacent Sibling Selector */
/* div + p { background-color:purple; } */
/* General Sibling Selector */
/* div ~ p { background-color:green; } */
</style></head><body>
<h2>CSS Combinators</h2>
<p>Comente e descomente uma regra por vez.</p>
<div>
<p>Paragraph 1 in the div.</p>
<p>Paragraph 2 in the div.</p>
<section><p>Paragraph 3 in section inside the div.</p></section>
</div>
<p>Paragraph 4. Immediately after the div.</p>
<p>Paragraph 5. Another sibling after the div.</p>
</body></html>
