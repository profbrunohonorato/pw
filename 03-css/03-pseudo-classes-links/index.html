<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Pseudo-classes</title><style>
a:link { color:red; }
a:visited { color:green; }
a:hover { color:hotpink; }
a:active { color:blue; }
</style></head><body>
<h2>Styling a link depending on state</h2>
<p><b><a href="https://www.w3schools.com/" target="_blank">This is a link</a></b></p>
<p><b>Note:</b> a:hover must come after a:link and a:visited.</p>
<p><b>Note:</b> a:active must come after a:hover.</p>
</body></html>
