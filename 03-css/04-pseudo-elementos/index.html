<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Pseudo-elementos</title><style>
h1::before { content:"★ "; }
p::first-line { color:#ff0000; font-variant:small-caps; }
::marker { color:red; font-size:23px; }
</style></head><body>
<h1>This is a heading</h1>
<p>The ::before pseudo-element inserts content before the content of an element.</p>
<p>You can use the ::first-line pseudo-element to add a special effect to the first line of a text. Some more text. And even more, and more, and more, and more.</p>
<ol><li>First</li><li>Second</li><li>Third</li></ol>
</body></html>
